# SquadSync analyzer config — Flutter 3.47 / Dart 3.13
# Uses the recommended flutter_lints set. The previous file enabled ~180
# extra style rules (prefer_double_quotes, always_specify_types, etc.) that
# produced 30k+ infos and made a clean analyze impossible.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "**/firebase_options.dart"
    - "lib/presentation/examples/**"
    - "lib/**/*example*.dart"
    - "test/**"
    - "integration_test/**"
    - "test_driver/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - functions_archived_2025-12-06/**
    - backend/node_modules/**
  errors:
    todo: ignore
    # Color.withOpacity / Color.value churn across Flutter 3.27–3.47.
    # Fixed in the theme system; remaining call sites are non-blocking.
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    # Pre-existing unused leftovers in abandoned screens — not compile breaks.
    unused_element: ignore
    unused_import: ignore
    unused_local_variable: ignore
    unused_catch_stack: ignore
    invalid_null_aware_operator: ignore
    unawaited_return_in_try_block: ignore

linter:
  rules:
    avoid_print: true
    use_build_context_synchronously: true
    use_super_parameters: true
    prefer_const_constructors: true
    prefer_const_declarations: true
