name: SquadSync
options:
  bundleIdPrefix: com.spencereese
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1"
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGNING_REQUIRED: NO
targets:
  SquadSync:
    type: application
    platform: iOS
    sources:
      - SquadSync
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.spencereese.squadsync
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: SquadSync/Info.plist
      PRODUCT_NAME: SquadSync
      TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - SquadSyncTests
        - SquadSyncUITests
  SquadSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SquadSyncTests
    dependencies:
      - target: SquadSync
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.spencereese.squadsync.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SquadSync.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SquadSync"
      BUNDLE_LOADER: "$(TEST_HOST)"
  SquadSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SquadSyncUITests
    dependencies:
      - target: SquadSync
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.spencereese.squadsync.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: SquadSync
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      TARGETED_DEVICE_FAMILY: "1"
