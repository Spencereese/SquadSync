name: squadsync
description: "Private chat for one squad of eight."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^5.2.0
  share_plus: ^10.1.4
  skeletonizer: ^3.0.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
