# Backend checks and, on later slices, the native iOS build.
# Runs on push and pull request for ios/** and ios/main only.
# Does not deploy, and does not run on repository default main or master.
name: ios

on:
  push:
    branches:
      - ios/main
      - 'ios/**'
  pull_request:
    branches:
      - ios/main
      - 'ios/**'

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fcm-payload:
    name: FCM payload tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Payload and claim tests
        run: deno test supabase/functions/sq8-notify-message supabase/functions/sq8-steam-presence

  sql:
    name: SQL RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sq8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations and run RLS checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sq8
        run: bash supabase/tests/run.sh

  ios-simulator:
    name: iOS simulator build and tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)
          preferred = ["iPhone 16 Pro", "iPhone 17 Pro", "iPhone 17", "iPhone 16e", "iPhone Air"]
          found = {}
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      found[device["name"]] = device["udid"]
          for name in preferred:
              if name in found:
                  print(found[name])
                  break
          else:
              if not found:
                  raise SystemExit("No available iPhone simulator")
              print(next(iter(found.values())))
          PY
          )
          echo "Using simulator $UDID"
          xcodebuild -project app/SquadSync.xcodeproj -scheme SquadSync -destination "platform=iOS Simulator,id=$UDID" test
