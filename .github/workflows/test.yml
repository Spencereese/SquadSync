name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Unit and Widget Tests
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze

    - name: Run tests with coverage
      run: flutter test --machine --coverage

    - name: Generate coverage report
      run: |
        # Install lcov if not present
        sudo apt-get update
        sudo apt-get install -y lcov bc

        # Check if coverage file exists
        if [ ! -f coverage/lcov.info ]; then
          echo "No coverage file found"
          exit 1
        fi

        # Generate HTML coverage report
        genhtml coverage/lcov.info -o coverage/html

        # Calculate coverage percentage
        COVERAGE_LINE=$(lcov --summary coverage/lcov.info | grep "lines......:")
        COVERAGE=$(echo "$COVERAGE_LINE" | sed 's/.*: \([0-9.]*\)%.*/\1/')
        echo "Coverage: $COVERAGE%"

        # Write coverage to file for badge
        echo $COVERAGE > coverage/coverage.txt

        # Fail if coverage is below 70%
        if (( $(echo "$COVERAGE < 70" | bc -l) )); then
          echo "Coverage is below 70%: $COVERAGE%"
          exit 1
        fi

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

  # Integration Tests
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android emulator
      run: |
        echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --install 'system-images;android-29;google_apis;x86'
        echo "no" | $ANDROID_HOME/tools/bin/avdmanager create avd -n test -k 'system-images;android-29;google_apis;x86'

    - name: Start Android emulator
      run: |
        $ANDROID_HOME/emulator/emulator -avd test -no-audio -no-window &
        $ANDROID_HOME/platform-tools/adb wait-for-device
        $ANDROID_HOME/platform-tools/adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'

    - name: Run integration tests
      run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/onboarding_flow_test.dart

  # Deploy Firebase Cloud Functions
  deploy-functions:
    name: Deploy Firebase Functions
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Authenticate to Firebase
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    - name: Deploy Cloud Functions
      run: |
        cd functions
        npm install
        firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}