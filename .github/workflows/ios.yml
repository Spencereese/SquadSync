# Linux checks only. Runs on push and pull request for ios/** and ios/main.
# iOS builds, simulator runs, and screenshots stay on the Mac mini.
# Does not deploy, and does not run on repository default main or master.
name: ios

on:
  push:
    branches:
      - ios/main
      - 'ios/**'
  pull_request:
    branches:
      - ios/main
      - 'ios/**'

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fcm-payload:
    name: FCM payload tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Scoped permissions. auth_test.ts reads index.ts and drives the real handler,
      # which reads (and the test sets) only the variables listed here; none are
      # set on the runner, so the handler takes its "notifications off" path. No
      # network permission: nothing here calls out (module downloads don't need it).
      - name: Payload and claim tests
        run: >-
          deno test
          --allow-read=supabase/functions/sq8-notify-message
          --allow-env=SQ8_PUSH_WEBHOOK_SECRET,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,FCM_SERVICE_ACCOUNT_JSON,APNS_KEY_P8,APNS_KEY_ID,APNS_TEAM_ID,APNS_BUNDLE_ID,APNS_SANDBOX
          supabase/functions/sq8-notify-message supabase/functions/sq8-steam-presence

  sql:
    name: SQL RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sq8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations and run RLS checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sq8
        run: bash supabase/tests/run.sh

  copy:
    name: User-facing copy check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails if "squad" shows up in any string a person can see or hear
      # (Swift literals, accessibility labels, plist usage strings). Code names are fine.
      - name: No "squad" in user-facing strings
        run: python3 scripts/check-copy.py

  swift-surface:
    name: Swift surface check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Linux unit harness does not compile SwiftUI files (MockStore,
      # GameOnViews, …). This catches non-exhaustive switches and typo'd
      # Type.member references in those files before a Mac build.
      - name: Exhaustive switches and type members
        run: python3 scripts/check-swift-surface.py
