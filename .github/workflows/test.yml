name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Analyze & unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Provide dummy .env for filesystem dotenv overlay
      run: cp .env.example .env

    - name: Install dependencies
      run: flutter pub get

    # Fail only on analyzer errors. Leftover unused-import / unused-element
    # warnings from the abandoned tree are tracked but not release-blocking.
    - name: Analyze lib
      run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

    - name: Run unit tests
      run: |
        flutter test \
          test/presentation/notifiers/game_notifier_test.dart \
          test/presentation/notifiers/chat_badge_skip_test.dart \
          test/core/email_auth_test.dart \
          test/core/app_env_test.dart \
          test/core/session_guard_test.dart \
          test/core/google_auth_config_test.dart \
          test/core/notification_routes_test.dart \
          test/core/notification_cooldowns_test.dart \
          test/core/layout_insets_test.dart \
          test/widgets/email_auth_actions_test.dart
